<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Feedback & Survey</div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="feedback.html" class="nav-link active">Feedback</a></li>
                <li><a href="survey.html" class="nav-link">Survey</a></li>
                <li><a href="result.html" class="nav-link">Results</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="form-box">
            <h2>Share Your Feedback</h2>
            <p class="form-subtitle">We value your opinion! Please help us improve.</p>

            <!-- Error Message -->
            <div class="error-message" id="errorMessage"></div>

            <!-- Success Message -->
            <div class="success-message" id="successMessage"></div>

            <!-- Feedback Form -->
            <form id="feedbackForm">
                <!-- Name Field -->
                <div class="form-group">
                    <label for="name">Your Name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Your Email *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <!-- Rating Field -->
                <div class="form-group">
                    <label for="rating">Rating (1 to 5) *</label>
                    <select id="rating" name="rating" required>
                        <option value="">-- Select Rating --</option>
                        <option value="1">1 - Poor</option>
                        <option value="2">2 - Fair</option>
                        <option value="3">3 - Good</option>
                        <option value="4">4 - Very Good</option>
                        <option value="5">5 - Excellent</option>
                    </select>
                </div>

                <!-- Message Field -->
                <div class="form-group">
                    <label for="message">Your Message/Feedback *</label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Please share your detailed feedback..."
                        rows="6"
                        required
                    ></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-large">Submit Feedback</button>
            </form>

            <!-- Link to Results -->
            <div class="form-footer">
                <p>Want to see feedback summary? <a href="result.html">View Results</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 Feedback & Survey Platform. All rights reserved.</p>
    </footer>

    <script src="js/feedback.js"></script>
</body>
</html>
