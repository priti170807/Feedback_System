<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Student Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h3>Student Quiz</h3>
            <a href="dashboard.html" class="btn btn-small">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="leaderboard-box">
            <h2>Leaderboard</h2>
            <p class="leaderboard-subtitle">Top students by highest score</p>

            <div class="leaderboard-table">
                <div class="table-header">
                    <div class="col-rank">Rank</div>
                    <div class="col-name">Student Name</div>
                    <div class="col-score">Score</div>
                </div>
                <div id="leaderboardBody">
                    <!-- Leaderboard entries will be inserted here by JavaScript -->
                </div>
            </div>

            <div class="leaderboard-empty" id="emptyMessage" style="display: none;">
                <p>No scores yet. Be the first to take the quiz!</p>
            </div>

            <div class="leaderboard-actions">
                <a href="dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="js/leaderboard.js"></script>
</body>
</html>
